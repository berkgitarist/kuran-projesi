<!DOCTYPE html>
<html lang="tr" class="dark-theme">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuran Teyit Yazılımı</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  <!-- Google API -->
  <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
  <script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>
</head>
<body>
  <!-- Üst Menü -->
  <div class="header-bar">
    <div class="nav-controls">
      <button id="menuToggle" class="nav-btn" aria-label="Menüyü Aç">☰</button>
      <button id="prevPage" class="nav-btn" aria-label="Önceki Sayfa">⟵</button>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Sure, ayet ara"/>
        <div id="autocomplete" class="autocomplete-suggestions"></div>
      </div>
      <button id="nextPage" class="nav-btn" aria-label="Sonraki Sayfa">⟶</button>
      <span id="currentPageDisplay">Kuran Oku</span>
    </div>
    <!-- Google Giriş / Çıkış -->
    <div id="authContainer" class="auth-container">
      <div id="g_id_onload"
           data-client_id="531554591019-2rshc2099esb0mivhu2t0o8rg6lfs1if.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false"></div>
      <div id="g_id_signin" 
           data-type="standard" 
           data-size="medium"
           data-theme="outline" 
           data-text="signin_with" 
           data-shape="rectangular"
           data-logo_alignment="left"></div>
      <button id="logoutBtn" class="auth-btn hidden" onclick="signOut()">Çıkış</button>
    </div>
  </div>
  <!-- Yükleme Göstergesi -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Yükleniyor...</div>
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
  </div>
  <!-- Ana İçerik -->
  <div class="main-container">
    <!-- Yan Menü -->
    <div class="sidebar hidden" id="sidebar">
      <div class="menu-section">
        <button id="notesPage" class="menu-item-btn">📝 Notlarım</button>
        <button id="settingsPage" class="menu-item-btn">⚙️ Ayarlar</button>
        <button id="closeMenu" class="menu-item-btn">✖ Kapat</button>
      </div>
      <div class="menu">
        <h2>Sureler</h2>
        <ul id="suraMenu"></ul>
      </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
    <!-- İçerik -->
    <div class="content-area" id="contentArea">
      <div id="quranContent" class="content-container"></div>
      <div id="iframeContent" class="content-container hidden">
        <div class="page-header"><h1>📖 Kuran Oku</h1></div>
        <iframe id="externalIframe" src="https://qurantft.com/" class="iframe-container" title="Kuran Oku"></iframe>
      </div>
    </div>
  </div>
  <!-- Kelime tooltip -->
  <div id="wordTooltip" class="word-tooltip"></div>
  <!-- İntro -->
  <div id="introVerse" class="intro-verse-screen">
    <div class="intro-verse-content">
      <h2>Çok Önemli Tavsiye</h2>
      <p>[17:36] Kendiniz için teyit etmediğiniz sürece hiçbir bilgiyi kabul etmeyin.</p>
      <p>Ben size işitme, görme ve beyin verdim ve siz onları kullanmaktan sorumlusunuz.</p>
    </div>
  </div>
  <!-- JavaScript dosyaları -->
  <script src="js/gdrive.js" defer></script>
  <script src="js/script.js" defer></script>
</body>
</html>
