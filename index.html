<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuran Çalışması</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Firebase SDK v9.6.0 (Compat sürüm) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

    <!-- Kendi script dosyan -->
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="header-bar">
        <div class="nav-controls">
            <button id="prevPage" class="nav-btn">⟵ Geri</button>
            <span id="currentPageDisplay">Yükleniyor...</span>
            <button id="nextPage" class="nav-btn">İleri ⟶</button>
            <button id="notesPage" class="nav-btn">📝 Notlarım</button>
        </div>
        <div id="authContainer" class="auth-container">
            <button id="loginBtn" class="auth-btn hidden">Google ile Giriş Yap</button>
            <span id="userEmail" class="login-info hidden"></span>
            <button id="logoutBtn" class="auth-btn hidden">Çıkış Yap</button>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Sure, ayet veya meal ara (örn: Bakara, 2:255, Rahman)">
            <div id="autocomplete" class="autocomplete-suggestions"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="menu">
                <h2>Sureler</h2>
                <ul id="suraMenu"></ul>
            </div>
        </div>
        <div class="content-area">
            <div id="content">İçerik buraya gelecek</div>
        </div>
    </div>
    <div id="wordTooltip" class="word-tooltip"></div>
</body>
</html>
